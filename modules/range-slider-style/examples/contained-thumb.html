<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>range-slider-style — contained thumb</title>
  <link rel="stylesheet" href="example-assets/range-slider-style.css">
  <style>
    * { box-sizing: border-box; }

    :root {
      --accent: #6366f1;
      --ink: #0f172a;
      --surface: #ffffff;
      --track-base: #e2e8f0;
    }
  </style>
</head>
<body style="
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  background: #f8fafc;
">
  <div style="
    width: clamp(250px, 90vw, 1500px);
    min-height: 100vh;
    padding-block: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: stretch;
    gap: 2rem;
  ">

    <!-- 1. Full-height rectangular track with square thumb -->
    <span class="slider" style="
      --slider-track: 28px;
      --slider-thumb: 28px;
      --slider-inset: calc(var(--slider-thumb) / 2);
      --slider-radius: 0px;
      --slider-fill-color: #475569;
      --slider-rest-color: var(--track-base);
    ">
      <input type="range" min="0" max="100" value="45" aria-label="Square thumb in rectangular track">
      <svg class="thumb" viewBox="0 0 28 28" display="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="25" height="25" style="
          fill: var(--surface);
          stroke: var(--ink);
          stroke-width: 3px;
        "/>
      </svg>
    </span>

    <!-- 2. Full-height LTR gradient rectangular track with narrow beveled-corner thumb -->
    <span class="slider" style="
      --slider-track: 28px;
      --slider-thumb: 14px;
      --slider-thumb-block: 28px;
      --slider-inset: calc(var(--slider-thumb) / 2);
      --slider-radius: 0px;
      --slider-track-color: linear-gradient(to right, #06b6d4, #6366f1, #ec4899, #f59e0b);
      --slider-fill-color: transparent;
      --slider-rest-color: transparent;
    ">
      <input type="range" min="0" max="100" value="60" aria-label="Narrow beveled thumb on gradient track">
      <svg class="thumb" viewBox="0 0 14 28" display="none" aria-hidden="true">
        <polygon points="4,1 10,1 13,4 13,24 10,27 4,27 1,24 1,4" style="
          fill: var(--surface);
          stroke: var(--ink);
          stroke-width: 2px;
        "/>
      </svg>
    </span>

    <!-- 3. Full-height large rounded track with bordered circle thumb -->
    <span class="slider" style="
      --slider-track: 36px;
      --slider-thumb: 36px;
      --slider-inset: calc(var(--slider-thumb) / 2);
      --slider-radius: 999px;
      --slider-fill-color: var(--accent);
      --slider-rest-color: color-mix(in srgb, var(--accent) 18%, var(--track-base));
    ">
      <input type="range" min="0" max="100" value="50" aria-label="Bordered circle thumb in large rounded track">
      <svg class="thumb" viewBox="0 0 36 36" display="none" aria-hidden="true">
        <circle cx="18" cy="18" r="16" style="
          fill: var(--surface);
          stroke: var(--accent);
          stroke-width: 4px;
        "/>
      </svg>
    </span>

  </div>
</body>
</html>
