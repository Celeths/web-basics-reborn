 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>range-slider-style — complex</title>
  <link rel="stylesheet" href="example-assets/range-slider-style.css">
  <style>
    * { box-sizing: border-box; }

    :root {
      --accent: #6366f1;
      --ink: #0f172a;
      --surface: #ffffff;
      --muted: #94a3b8;
      --track-base: #e2e8f0;
      --animation-speed: 100;
    }

    /* Interactive state rules (pseudo-classes & keyframes cannot be inline) */

    /* 1. Ring & dot */
    .ring-dot > .thumb .dot { fill: var(--accent); }
    .ring-dot > .thumb .ring {
      stroke: var(--ink);
      stroke-width: 5px;
      transition:
        stroke var(--slider-dur) linear,
        stroke-width var(--slider-dur) ease-out,
        transform var(--slider-dur) ease-out;
    }
    .ring-dot:is(:hover, :has(> input:active)) > .thumb .dot {
      fill: var(--ink);
      animation: dot-pulse var(--slider-dur) cubic-bezier(0, 0, 0.58, 1);
    }
    .ring-dot:is(:hover, :has(> input:active)) > .thumb .ring {
      stroke: var(--accent);
      stroke-width: 4px;
      transform: scale(1.15);
      transition-timing-function:
        linear,
        ease-out,
        linear(0, 0.72 15%, 1.25 45%, 1.33 61%, 1.16 80%, 1);
    }
    @keyframes dot-pulse {
      0%, 100% { transform: scale(1); }
      60%      { transform: scale(1.12); }
    }

    /* 2. Diamond */
    .diamond > .thumb .shape { fill: var(--surface); }
    .diamond:is(:hover, :has(> input:active)) > .thumb .shape {
      fill: #0ea5e9;
      transform: rotate(90deg) scale(1.15);
    }

    /* 3. Audio fader */
    .fader > .thumb .cap   { stroke: var(--ink); }
    .fader > .thumb .ridge { stroke: var(--muted); }
    .fader:is(:hover, :has(> input:active)) > .thumb .handle { transform: scale(1.1); }
    .fader:is(:hover, :has(> input:active)) > .thumb .cap,
    .fader:is(:hover, :has(> input:active)) > .thumb .ridge  { stroke: #10b981; }

    /* 4. Pointer pin */
    .pin:is(:hover, :has(> input:active)) > .thumb .shape { transform: scale(1.15); }
  </style>
</head>
<body style="
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  background: #f8fafc;
">
  <div style="
    width: clamp(250px, 90vw, 1500px);
    min-height: 100vh;
    padding-block: 1.5rem;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    align-items: stretch;
    gap: 2rem;
  ">

    <!-- 1. Animated ring & dot -->
    <span class="slider ring-dot" style="
      --slider-track: 6px;
      --slider-thumb: 28px;
      --slider-inset: calc(var(--slider-track) / 2);
      --slider-fill-color: var(--accent);
      --slider-rest-color: color-mix(in srgb, var(--accent) 22%, var(--track-base));
      --slider-dur: calc(0.5s * (var(--animation-speed) / 100));
    ">
      <input type="range" min="0" max="100" value="40" aria-label="Animated ring and dot slider">
      <svg class="thumb" viewBox="-1 -1 26 26" display="none" aria-hidden="true">
        <circle class="dot" cx="12" cy="12" r="2.9" style="
          transform-origin: 12px 12px;
          transition: fill var(--slider-dur) linear;
        "/>
        <circle class="ring" cx="12" cy="12" r="7.687" style="
          fill: none;
          transform-origin: 12px 12px;
        "/>
      </svg>
    </span>

    <!-- 2. Animated diamond -->
    <span class="slider diamond" style="
      --slider-track: 6px;
      --slider-thumb: 24px;
      --slider-fill-color: #0ea5e9;
      --slider-rest-color: color-mix(in srgb, #0ea5e9 18%, var(--track-base));
    ">
      <input type="range" min="0" max="100" value="30" aria-label="Animated diamond slider">
      <svg class="thumb" viewBox="0 0 24 24" display="none" aria-hidden="true">
        <polygon class="shape" points="12,2 22,12 12,22 2,12" style="
          stroke: #0ea5e9;
          stroke-width: 2.5px;
          transform-origin: 12px 12px;
          transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), fill 0.2s ease;
        "/>
      </svg>
    </span>

    <!-- 3. Animated audio fader -->
    <span class="slider fader" style="
      --slider-track: 4px;
      --slider-thumb: 18px;
      --slider-thumb-block: 30px;
      --slider-radius: 2px;
      --slider-fill-color: #10b981;
      --slider-rest-color: color-mix(in srgb, #10b981 18%, var(--track-base));
    ">
      <input type="range" min="0" max="100" value="55" aria-label="Animated audio fader slider">
      <svg class="thumb" viewBox="0 0 18 30" display="none" aria-hidden="true">
        <g class="handle" style="
          transform-origin: 9px 15px;
          transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        ">
          <rect class="cap" x="1" y="1" width="16" height="28" rx="4" style="
            fill: var(--surface);
            stroke-width: 1.5px;
            transition: stroke 0.18s ease;
          "/>
          <line class="ridge" x1="5" y1="11" x2="13" y2="11" style="
            stroke-width: 1.5px;
            stroke-linecap: round;
            transition: stroke 0.18s ease;
          "/>
          <line class="ridge" x1="5" y1="15" x2="13" y2="15" style="
            stroke-width: 1.5px;
            stroke-linecap: round;
            transition: stroke 0.18s ease;
          "/>
          <line class="ridge" x1="5" y1="19" x2="13" y2="19" style="
            stroke-width: 1.5px;
            stroke-linecap: round;
            transition: stroke 0.18s ease;
          "/>
        </g>
      </svg>
    </span>

    <!-- 4. Animated pointer pin -->
    <span class="slider pin" style="
      --slider-track: 6px;
      --slider-thumb: 24px;
      --slider-thumb-block: 32px;
      --slider-fill-color: #ec4899;
      --slider-rest-color: color-mix(in srgb, #ec4899 18%, var(--track-base));
    ">
      <input type="range" min="0" max="100" value="75" aria-label="Animated pointer pin slider">
      <svg class="thumb" viewBox="0 0 24 32" display="none" aria-hidden="true" style="
        translate: -50% -78%;
      ">
        <g class="shape" style="
          fill: #ec4899;
          transform-origin: 12px 26px;
          transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        ">
          <path d="M12 2 C6.5 2 2 6.5 2 12 C2 19 12 29 12 29 C12 29 22 19 22 12 C22 6.5 17.5 2 12 2 Z"/>
          <circle cx="12" cy="12" r="4" style="
            fill: var(--surface);
          "/>
        </g>
      </svg>
    </span>

  </div>
</body>
</html>
